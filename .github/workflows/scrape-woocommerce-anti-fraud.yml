name: Scrape Woocommerce Anti Fraud Documentation

on:
  schedule:
    - cron: '40 11 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Woocommerce Anti Fraud scraper
        run: bash scripts/run-scrape.sh --slug=woocommerce-anti-fraud --mode=html-scrape --url=https://woocommerce.com/document/woocommerce-anti-fraud/ --selector=.wccom-single-doc-content --name="WooCommerce Anti Fraud"

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet plugins/ INDEX.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push results
        if: steps.changes.outputs.changed == 'true'
        env:
          SCRAPE_SLUG: woocommerce-anti-fraud
          SCRAPE_NAME: "Woocommerce Anti Fraud"
        run: bash scripts/gh-push-scrape.sh
