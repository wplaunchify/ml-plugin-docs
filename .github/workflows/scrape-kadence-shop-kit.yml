name: Scrape Kadence Shop Kit Documentation

on:
  schedule:
    - cron: '50 17 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Kadence Shop Kit scraper
        run: bash scripts/run-scrape.sh --slug=kadence-shop-kit --mode=sitemap --url=https://www.kadencewp.com/help-center/docs/kadence-shop-kit/ --selector=.nx-prose --sitemap-index=https://www.kadencewp.com/help-center/sitemap_index.xml --name="Kadence Shop Kit"

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet plugins/ INDEX.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push results
        if: steps.changes.outputs.changed == 'true'
        env:
          SCRAPE_SLUG: kadence-shop-kit
          SCRAPE_NAME: "Kadence Shop Kit"
        run: bash scripts/gh-push-scrape.sh
