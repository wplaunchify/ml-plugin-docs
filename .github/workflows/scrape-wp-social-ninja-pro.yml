name: Scrape Wp Social Ninja Pro Documentation

on:
  schedule:
    - cron: '20 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Wp Social Ninja Pro scraper
        run: bash scripts/run-scrape.sh --slug=wp-social-ninja-pro --mode=sitemap --url=https://docs.wpsocialninja.com/guide/ --selector=.vp-doc --name="WP Social Ninja Pro"

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet plugins/ INDEX.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push results
        if: steps.changes.outputs.changed == 'true'
        env:
          SCRAPE_SLUG: wp-social-ninja-pro
          SCRAPE_NAME: "Wp Social Ninja Pro"
        run: bash scripts/gh-push-scrape.sh
